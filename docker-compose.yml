version: '3'
networks:
  auctionwww:
      driver: bridge
services:
  auctionwww:
    container_name: auctionwww
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    volumes:
      - '.:/app'
      - '/app/node_modules'
    ports:
      - 70:7700
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - auctionwww